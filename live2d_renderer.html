<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live2D Renderer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: "Segoe UI", sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: transparent;
    }

    #message {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      max-width: min(88vw, 420px);
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(11, 14, 22, 0.68);
      color: rgba(255, 255, 255, 0.92);
      font-size: 13px;
      text-align: center;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="message">Loading Live2D...</div>

  <script>
    const messageEl = document.getElementById("message");
    const params = new URLSearchParams(window.location.search);
    const modelInput = params.get("model") || "./models/whale-girl/c_0120.model3.json";
    const vendorInput = params.get("vendor") || "./vendor/";
    const motionConfig = parseMotionConfig(params.get("motions"));
    const cubism4RemoteCandidates = [
      "https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js",
      "https://unpkg.com/pixi-live2d-display@0.4.0/dist/cubism4.min.js"
    ];

    const MotionPriority = { IDLE: 1, NORMAL: 2, FORCE: 3 };
    const CURVE_TARGET_PARAMETER = 1;
    // Fallback when the model has no companion.json: patterns are tried in order and the
    // first one that matches any model group wins.
    const MOTION_ROLE_PATTERNS = {
      talk: [/^talk/i, /^tap/i],
      ambient: [/^flick/i, /^tap/i],
    };
    const AMBIENT_CHANCE = 0.35;
    const gestureParamIds = new Set();

    function parseMotionConfig(raw) {
      if (!raw) {
        return null;
      }
      try {
        return JSON.parse(raw);
      } catch (error) {
        console.error("[Live2D] Invalid motions config:", raw, error);
        return null;
      }
    }

    let app = null;
    let model = null;
    let talking = false;
    let idlePhase = 0;

    function showMessage(text) {
      messageEl.textContent = text;
    }

    function normalizePath(path) {
      if (!path) {
        return "";
      }
      if (/^file:\/\//i.test(path) || /^https?:\/\//i.test(path)) {
        return path;
      }
      if (/^[A-Za-z]:[\\/]/.test(path)) {
        return "file:///" + path.replace(/\\/g, "/");
      }
      return path;
    }

    function ensureTrailingSlash(path) {
      return path.endsWith("/") ? path : path + "/";
    }

    function joinPath(base, name) {
      return ensureTrailingSlash(base) + name;
    }

    function buildModelCandidates(input) {
      const normalized = normalizePath(input);
      const candidates = [];
      const push = (value) => {
        if (value && !candidates.includes(value)) {
          candidates.push(value);
        }
      };

      push(normalized);
      if (/\.model3$/i.test(normalized)) {
        push(normalized + ".json");
      } else if (/\.model3\.json$/i.test(normalized)) {
        push(normalized.slice(0, -5));
      } else {
        push(normalized + ".model3.json");
        push(normalized + ".model3");
      }

      return candidates;
    }

    async function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => resolve(src);
        script.onerror = () => reject(new Error("Failed to load script: " + src));
        document.head.appendChild(script);
      });
    }

    async function loadFirstAvailable(label, candidates) {
      let lastError = null;
      for (const src of candidates) {
        try {
          console.info(`[Live2D] Loading ${label}: ${src}`);
          await loadScript(src);
          console.info(`[Live2D] Loaded ${label}: ${src}`);
          return src;
        } catch (error) {
          lastError = error;
          console.error(`[Live2D] Failed ${label}: ${src}`, error);
        }
      }
      throw lastError || new Error(`No ${label} candidate could be loaded.`);
    }

    function resetLive2DNamespace() {
      if (window.PIXI && window.PIXI.live2d) {
        try {
          delete window.PIXI.live2d;
        } catch (_) {
          window.PIXI.live2d = undefined;
        }
      }
    }

    async function bootCubism4Runtime() {
      if (!window.Live2DCubismCore) {
        throw new Error("Live2DCubismCore is missing after loading live2dcubismcore.min.js.");
      }

      if (!window.PIXI || !window.PIXI.live2d) {
        throw new Error("PIXI.live2d was not created by the loaded Cubism4 bundle.");
      }

      console.info("[Live2D] live2d exports:", Object.keys(window.PIXI.live2d));

      if (window.PIXI.live2d.config) {
        window.PIXI.live2d.config.logLevel = window.PIXI.live2d.config.LOG_LEVEL_VERBOSE;
      }

      if (typeof window.PIXI.live2d.startUpCubism4 === "function") {
        console.info("[Live2D] Calling startUpCubism4().");
        window.PIXI.live2d.startUpCubism4();
      }

      if (typeof window.PIXI.live2d.cubism4Ready === "function") {
        console.info("[Live2D] Waiting for cubism4Ready().");
        await window.PIXI.live2d.cubism4Ready();
      }

      if (!window.PIXI.live2d.Live2DModel) {
        throw new Error("PIXI.live2d.Live2DModel is still missing after Cubism 4 startup.");
      }
    }

    async function loadCubism4Bundle(candidates) {
      let lastError = null;
      for (const src of candidates) {
        try {
          resetLive2DNamespace();
          console.info(`[Live2D] Trying Cubism4 bundle: ${src}`);
          await loadScript(src);
          await bootCubism4Runtime();
          console.info(`[Live2D] Cubism4 bundle ready: ${src}`);
          return src;
        } catch (error) {
          lastError = error;
          console.error(`[Live2D] Cubism4 bundle failed: ${src}`, error);
        }
      }
      throw lastError || new Error("No Cubism4 bundle could be initialized.");
    }

    function fitModel() {
      if (!app || !model) {
        return;
      }

      const width = window.innerWidth;
      const height = window.innerHeight;
      const bounds = model.getLocalBounds();
      const safeWidth = Math.max(bounds.width, 1);
      const safeHeight = Math.max(bounds.height, 1);
      const scale = Math.min((width * 0.88) / safeWidth, (height * 0.9) / safeHeight);

      model.scale.set(scale);
      if (model.anchor && typeof model.anchor.set === "function") {
        model.anchor.set(0.5, 1.0);
      } else if (model.pivot && typeof model.pivot.set === "function") {
        model.pivot.set(bounds.x + safeWidth / 2, bounds.y + safeHeight);
      }
      model.x = width * 0.5;
      model.y = height - 6;
    }

    function getMotionManager() {
      return model?.internalModel?.motionManager || model?.motionManager || null;
    }

    function getMotionGroups() {
      return Object.keys(getMotionManager()?.definitions || {});
    }

    function groupsForRole(role) {
      const groups = getMotionGroups();
      const configured = motionConfig?.[role];
      if (Array.isArray(configured)) {
        return configured.filter((group) => groups.includes(group));
      }
      for (const pattern of MOTION_ROLE_PATTERNS[role] || []) {
        const matches = groups.filter((group) => pattern.test(group));
        if (matches.length) {
          return matches;
        }
      }
      return [];
    }

    function startRoleMotion(role, priority) {
      const candidates = groupsForRole(role);
      if (!model || !candidates.length) {
        return false;
      }
      const group = candidates[Math.floor(Math.random() * candidates.length)];
      model.motion(group, undefined, priority).then((started) => {
        if (!started) {
          console.warn(`[Live2D] Motion did not start: role=${role} group=${group}`);
        }
      });
      return true;
    }

    // pixi-live2d-display saves the parameter snapshot after motions write to it, so a
    // finished gesture's last frame sticks (props like a phone or a plate stay on screen).
    // Reset every parameter a gesture drives back to its default when motions finish.
    function trackGestureParams(group, motion) {
      if (group === getMotionManager()?.groups?.idle) {
        return;
      }
      for (const curve of motion?._motionData?.curves || []) {
        if (curve.type === CURVE_TARGET_PARAMETER) {
          gestureParamIds.add(curve.id);
        }
      }
    }

    function resetGesturePose() {
      const core = model?.internalModel?.coreModel;
      if (!core || !gestureParamIds.size) {
        return;
      }
      for (const id of gestureParamIds) {
        const index = core.getParameterIndex(id);
        if (index >= 0) {
          core.setParameterValueByIndex(index, core.getParameterDefaultValue(index));
        }
      }
      core.saveParameters();
    }

    // The library only auto-loops a group literally named "Idle"; models such as the whale
    // girl name it "idle", so point the manager at the model's real idle group.
    function configureIdleGroup(manager) {
      const groups = getMotionGroups();
      const configured = (motionConfig?.idle || []).find((group) => groups.includes(group));
      const idle = configured || groups.find((group) => group.toLowerCase() === "idle");
      if (idle && manager.groups) {
        manager.groups.idle = idle;
      }
    }

    function setupMotions() {
      const manager = getMotionManager();
      if (!manager) {
        return;
      }
      configureIdleGroup(manager);
      for (const [group, motions] of Object.entries(manager.motionGroups || {})) {
        (motions || []).forEach((motion) => trackGestureParams(group, motion));
      }
      manager.on("motionLoaded", (group, _index, motion) => trackGestureParams(group, motion));
      manager.on("motionFinish", resetGesturePose);
    }

    // The library loops the model's idle group on its own; this only adds occasional gestures.
    function playRandomMotion() {
      if (talking || Math.random() > AMBIENT_CHANCE) {
        return false;
      }
      return startRoleMotion("ambient", MotionPriority.NORMAL);
    }

    function setTalking(active) {
      talking = Boolean(active);
      if (talking) {
        startRoleMotion("talk", MotionPriority.FORCE);
        showMessage("Speaking...");
        return;
      }
      showMessage("Ready");
    }

    function animateFallback(delta) {
      if (!model) {
        return;
      }

      idlePhase += delta * 0.03;
      const bob = talking ? Math.sin(idlePhase * 4.0) * 6 : Math.sin(idlePhase) * 2;
      const sway = talking ? Math.sin(idlePhase * 2.5) * 0.02 : Math.sin(idlePhase * 0.6) * 0.01;

      model.y = window.innerHeight - 6 + bob;
      model.rotation = sway;
    }

    async function loadModelFromCandidates(candidates) {
      let lastError = null;
      for (const candidate of candidates) {
        try {
          console.info(`[Live2D] Trying model: ${candidate}`);
          const loaded = await window.PIXI.live2d.Live2DModel.from(candidate);
          console.info(`[Live2D] Loaded model: ${candidate}`);
          return { model: loaded, path: candidate };
        } catch (error) {
          lastError = error;
          console.error(`[Live2D] Failed model: ${candidate}`, error);
        }
      }

      throw lastError || new Error(`Model load failed. Tried: ${candidates.join(", ")}`);
    }

    async function init() {
      const vendorBase = ensureTrailingSlash(normalizePath(vendorInput));
      const modelCandidates = buildModelCandidates(modelInput);
      console.info("[Live2D] Vendor base:", vendorBase);
      console.info("[Live2D] Model candidates:", modelCandidates);

      try {
        await loadFirstAvailable("PIXI", [
          joinPath(vendorBase, "pixi.min.js"),
          joinPath(vendorBase, "pixi.js")
        ]);

        await loadFirstAvailable("Cubism Core", [
          joinPath(vendorBase, "live2dcubismcore.min.js"),
          joinPath(vendorBase, "live2dcubismcore.js")
        ]);

        await loadCubism4Bundle([
          joinPath(vendorBase, "cubism4.min.js"),
          ...cubism4RemoteCandidates
        ]);
      } catch (error) {
        console.error("[Live2D] Runtime dependency load failed.", error);
        console.error("[Live2D] Hint: vendor/pixi-live2d-display.min.js is a legacy bundle and still needs live2d.min.js. Put dist/cubism4.min.js into vendor for offline use, or let the CDN fallback load it.");
        showMessage("Live2D runtime failed. Check the console for Cubism4 bundle details.");
        return;
      }

      app = new window.PIXI.Application({
        autoStart: true,
        resizeTo: window,
        backgroundAlpha: 0,
        antialias: true,
      });

      document.getElementById("stage").appendChild(app.view);

      try {
        const loaded = await loadModelFromCandidates(modelCandidates);
        model = loaded.model;
        console.info("[Live2D] Active model path:", loaded.path);
      } catch (error) {
        console.error("[Live2D] Model load failed for every candidate.", error);
        showMessage("Model load failed. Check the console for exact model3.json paths.");
        return;
      }

      setupMotions();
      app.stage.addChild(model);
      fitModel();
      app.ticker.add(animateFallback);

      console.info("[Live2D] Motion groups:", getMotionGroups());
      showMessage("Ready");
    }

    window.Live2DController = {
      setTalking,
      playRandomMotion,
      getMotionGroups
    };

    window.addEventListener("resize", fitModel);
    init().catch((error) => {
      console.error("[Live2D] Unhandled renderer error.", error);
      showMessage("Renderer startup failed. Check the console for details.");
    });
  </script>
</body>
</html>
