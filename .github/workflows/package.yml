name: Package

# Build the desktop app with ai-companion.spec on each OS, run the offline
# self-test on the frozen build, and upload it as a workflow artifact.
# Releases are cut by hand; this workflow never tags or publishes.

on:
  push:
    branches: [master, agent-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual runs get their own group so several can run side by side (e.g. to check for flakes).
  group: package-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            archive: AI-Companion-macOS.zip
          - os: windows-latest
            archive: AI-Companion-Windows.zip
          - os: ubuntu-latest
            archive: AI-Companion-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Qt WebEngine system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgbm1 libnss3 libasound2t64 libxkbcommon0 libxkbcommon-x11-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libxshmfence1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Install app dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build
        run: pyinstaller --noconfirm ai-companion.spec

      - name: Self-test the frozen build (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/AI Companion.app/Contents/MacOS/AI Companion" --self-test "$RUNNER_TEMP/self-test.txt"

      - name: Self-test the frozen build (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          # Ubuntu runners restrict the unprivileged user namespaces Chromium's sandbox needs.
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          # Hosted runners have no GPU and Chromium blocklists WebGL; render it in software.
          # Compositing stays in software too: Chromium crashed (SIGTRAP) about half the time
          # when it tried hardware compositing on the Mesa software rasterizer.
          QTWEBENGINE_CHROMIUM_FLAGS: --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-compositing
          QT_QUICK_BACKEND: software
        # Software WebGL on the runner occasionally crashes Chromium (SIGTRAP) after the
        # renderer connects; retry once so a real break still fails twice in a row.
        run: |
          for attempt in 1 2; do
            status=0
            "dist/AI Companion/AI Companion" --self-test "$RUNNER_TEMP/self-test.txt" || status=$?
            [ "$status" -eq 0 ] && exit 0
            echo "::warning::Self-test attempt $attempt failed with exit code $status"
          done
          exit 1

      - name: Self-test the frozen build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # No GPU here either: allow Chromium's default ANGLE/D3D11 path on the WARP software
          # rasterizer, which Windows always has (ANGLE's SwiftShader is not shipped by Qt).
          QTWEBENGINE_CHROMIUM_FLAGS: --ignore-gpu-blocklist
        run: |
          # A windowed executable returns immediately unless waited on, and has no stdout.
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          $exe = Join-Path $PWD "dist\AI Companion\AI Companion.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          exit $process.ExitCode

      - name: Show the self-test report
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/self-test.txt" || echo "No self-test report was written."

      # The license and attribution notices are inside each bundle (see DATAS in the spec);
      # a top-level copy in every archive puts them in front of whoever unpacks it.
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "package/AI Companion"
          ditto "dist/AI Companion.app" "package/AI Companion/AI Companion.app"
          cp LICENSE NOTICE.md "package/AI Companion/"
          ditto -c -k --keepParent "package/AI Companion" "${{ matrix.archive }}"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, NOTICE.md -Destination "dist\AI Companion"
          Compress-Archive -Path "dist\AI Companion" -DestinationPath "${{ matrix.archive }}"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cp LICENSE NOTICE.md "dist/AI Companion/"
          tar -czf "${{ matrix.archive }}" -C dist "AI Companion"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14
